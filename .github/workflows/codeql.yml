# CodeQL scans the backend (Java) and frontend (JavaScript) for security
# vulnerabilities such as SQL injection, cross-site scripting and broken
# access checks. Results appear under Security > Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # every Monday 06:17 SAST, catches newly published vulnerability patterns

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none # no database or Maven build needed
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
