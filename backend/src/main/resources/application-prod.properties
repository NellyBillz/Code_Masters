# Production profile. Start the backend with:
#   SPRING_PROFILES_ACTIVE=prod ./mvnw spring-boot:run   (or java -jar with the same env var)
#
# Quantum-readiness: the only public entry point is nginx, which uses
# post-quantum hybrid TLS (deploy/nginx/codemasters.conf). Java 21's own TLS
# does not support post-quantum key exchange yet, so the backend must never
# be reachable over a network: it listens on this machine only.
server.address=127.0.0.1

# Session and CSRF cookies are only ever sent over HTTPS.
app.cookies.secure=true

# Trust the X-Forwarded-* headers set by nginx on the same machine.
server.forward-headers-strategy=native

# Keep PostgreSQL on the same machine (localhost) or a private network.
# If it must be on another server, connect over a WireGuard tunnel with a
# preshared key (WireGuard's post-quantum mode) and set DATABASE_URL, e.g.
#   jdbc:postgresql://10.8.0.2:5432/codemaster_db?sslmode=verify-full
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/codemaster_db}

# No fallback values: if these aren't set, the backend refuses to start
# instead of quietly using the default postgres/postgres login.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never print SQL (it can contain personal data) in production logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Don't leak stack traces or internal messages in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
