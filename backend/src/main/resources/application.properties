spring.application.name=backend

# Import password from .env file
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/codemaster_db
spring.datasource.username=postgres
spring.datasource.password=${LOCAL_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JPA Settings (Notice we removed hibernate.dialect as recommended by your console log)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# GitHub REST API (GH-1.2 spike: plumbing only, no data mapping yet)
github.api.base-url=https://api.github.com
github.api.token=${GITHUB_API_TOKEN:}