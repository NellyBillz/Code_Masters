spring.application.name=backend

# Import password from .env file
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/codemaster_db
spring.datasource.username=${LOCAL_DB_USERNAME:postgres}
spring.datasource.password=${LOCAL_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JPA Settings (Notice we removed hibernate.dialect as recommended by your console log)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# GitHub REST API (GH-1.2 spike: plumbing only, no data mapping yet)
github.api.base-url=https://api.github.com
github.api.token=${GITHUB_API_TOKEN:}

# GitHub OAuth login (AUTH-02)
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
github.oauth.callback-url=${GITHUB_OAUTH_CALLBACK_URL:http://localhost:8080/auth/github/callback}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.session-ttl=${SESSION_TTL:PT168H}
app.cookies.secure=${COOKIE_SECURE:false}

# Rate limiting (API-03.10): per-user, per-action-type requests allowed per hour.
# Starting numbers per codemasters-api-design.md §16 — configuration values, not a locked contract.
app.rate-limit.comments-per-hour=${RATE_LIMIT_COMMENTS_PER_HOUR:20}
app.rate-limit.claims-per-hour=${RATE_LIMIT_CLAIMS_PER_HOUR:10}
app.rate-limit.reports-per-hour=${RATE_LIMIT_REPORTS_PER_HOUR:5}
app.rate-limit.collaboration-requests-per-hour=${RATE_LIMIT_COLLABORATION_REQUESTS_PER_HOUR:10}
# Security audit follow-up (2026-09-24): project submission and the OAuth flow had no limit at all.
app.rate-limit.project-submissions-per-hour=${RATE_LIMIT_PROJECT_SUBMISSIONS_PER_HOUR:5}
app.rate-limit.oauth-attempts-per-hour=${RATE_LIMIT_OAUTH_ATTEMPTS_PER_HOUR:20}

# SQL Formatting & Execution Logs (Set to true when debugging queries)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
