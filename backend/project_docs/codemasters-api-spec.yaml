openapi: 3.1.0
info:
  title: Code Masters API
  version: 2.1.0
  description: >
    REST API for Code Masters, a South African/African open-source discovery and
    contribution platform. Code Masters is a discovery/community layer on top of
    GitHub: GitHub remains the source of truth for repository code, issues, pull
    requests and contribution execution.


    Auth: server-side session delivered as a secure, HttpOnly, SameSite=Lax cookie.
    State-changing requests (POST/PATCH/DELETE) additionally require a CSRF token in
    the `X-CSRF-Token` header, issued at session creation.
servers:
  - url: https://api.codemasters.example/api/v1
    description: Production placeholder
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Projects
    description: Discover and manage South African/Africa-connected open-source projects.
  - name: Maintainers
    description: Manage who can administer a project's Code Masters listing.
  - name: Issues
    description: Discover contribution opportunities linked to GitHub issues.
  - name: Comments
    description: Community discussion attached to projects and issues.
  - name: Claims
    description: Lightweight local signals of contributor intent.
  - name: Users
    description: Developer profiles and public contribution identity.
  - name: Search
    description: Cross-platform discovery and filtering.
  - name: GitHub
    description: GitHub OAuth, synchronization and integration endpoints.
  - name: Health
    description: Operational health checks.
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /projects:
    get:
      tags: [Projects]
      summary: List and filter projects
      description: Public endpoint. Supports pagination and discovery filters.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          schema: { type: string }
          description: Search project name, description, topics or owner.
        - name: language
          in: query
          schema: { type: string }
          description: Primary programming language.
        - name: category
          in: query
          schema: { type: string }
          description: Project category.
        - name: tag
          in: query
          schema: { type: string }
          description: Topic/tag.
        - name: country
          in: query
          schema: { type: string, example: ZA }
          description: Country connection. Default discovery focus is ZA.
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, recent, stars, contributors]
          description: Discovery ordering.
        - name: hasBeginnerIssues
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Projects returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProjects'
    post:
      tags: [Projects]
      summary: Submit a project
      description: >
        Creates the project and automatically adds the submitter as a maintainer
        with role `owner` in the same transaction.
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Project already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project details
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: Update project metadata
      description: >
        Requires the caller to be a maintainer (any role) on this project.
        GitHub-derived fields should normally be refreshed by sync rather than
        manually edited.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/maintainers:
    post:
      tags: [Maintainers]
      summary: Invite a maintainer
      description: Requires the caller to hold role `owner` on this project.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMaintainerRequest'
      responses:
        '201':
          description: Maintainer added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMaintainer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: User is already a maintainer on this project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /projects/{projectId}/maintainers/{userId}:
    delete:
      tags: [Maintainers]
      summary: Remove a maintainer
      description: >
        Requires the caller to hold role `owner`. The last remaining owner on a
        project cannot be removed.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Maintainer removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cannot remove the last owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /projects/{projectId}/issues:
    get:
      tags: [Issues]
      summary: List contribution opportunities for a project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: difficulty
          in: query
          schema: { $ref: '#/components/schemas/Difficulty' }
        - name: label
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [open, claimed, closed]
      responses:
        '200':
          description: Issues returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedIssues' }

  /projects/{projectId}/issues/sync:
    post:
      tags: [GitHub, Issues]
      summary: Synchronize project issues from GitHub
      description: >
        Enqueues a synchronization job that fetches eligible open GitHub issues
        and updates the local discovery index. Returns immediately with a job
        the client polls via GET /sync-jobs/{jobId}. Requires the caller to be a
        maintainer on the project.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '202':
          description: Synchronization accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sync-jobs/{jobId}:
    get:
      tags: [GitHub]
      summary: Get synchronization job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectId}/comments:
    get:
      tags: [Comments]
      summary: List project discussion
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Comments returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedComments' }
    post:
      tags: [Comments]
      summary: Start or continue project discussion
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /issues/{issueId}:
    get:
      tags: [Issues]
      summary: Get contribution opportunity
      parameters:
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: Issue details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Issues]
      summary: Override local issue classification
      description: >
        Lets a project maintainer correct difficulty or beginner-friendly status
        when the automated scoring gets it wrong. Marks the field as
        maintainer-overridden so a later sync will not silently replace it.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIssueRequest' }
      responses:
        '200':
          description: Issue updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /issues/{issueId}/comments:
    get:
      tags: [Comments]
      summary: List issue discussion
      parameters:
        - $ref: '#/components/parameters/IssueId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Comments returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedComments' }
    post:
      tags: [Comments]
      summary: Comment on an issue
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentRequest' }
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /comments/{commentId}:
    patch:
      tags: [Comments]
      summary: Edit a comment
      description: Requires the caller to be the comment's author.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCommentRequest' }
      responses:
        '200':
          description: Comment updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Comments]
      summary: Delete a comment
      description: >
        Requires the caller to be the comment's author or a maintainer of the
        parent project. Soft-deletes; the comment body is not returned by any
        subsequent read.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '204': { description: Comment deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /issues/{issueId}/claim:
    post:
      tags: [Claims]
      summary: Claim an issue on Code Masters
      description: >
        Creates a lightweight local claim so a contributor can signal intent.
        Does not assign the GitHub issue. Multiple different users may each hold
        an active claim on the same issue at once — this is a signal of
        interest, not an exclusive lock (see API design doc §7).
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClaimRequest' }
      responses:
        '201':
          description: Claim created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Caller already has an active claim for this issue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Claims]
      summary: Release the caller's issue claim
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IssueId'
      responses:
        '204': { description: Claim released. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /issues/{issueId}/claims:
    get:
      tags: [Claims]
      summary: List active claims on an issue
      parameters:
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: Active claims, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Claim' }
        '404': { $ref: '#/components/responses/NotFound' }

  /search:
    get:
      tags: [Search]
      summary: Unified project and issue search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: type
          in: query
          schema:
            type: string
            enum: [all, projects, issues]
            default: all
        - name: language
          in: query
          schema: { type: string }
        - name: difficulty
          in: query
          schema: { $ref: '#/components/schemas/Difficulty' }
        - name: country
          in: query
          schema: { type: string, example: ZA }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedSearchResults' }

  /users/me:
    get:
      tags: [Users]
      summary: Get current developer profile
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
    patch:
      tags: [Users]
      summary: Update current profile
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }

  /users/{username}:
    get:
      tags: [Users]
      summary: Get public developer profile
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUserProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/github:
    get:
      tags: [GitHub]
      summary: Start GitHub OAuth
      description: Frontend redirects the user here. Backend redirects to GitHub's authorization endpoint.
      responses:
        '302': { description: Redirect to GitHub. }

  /auth/github/callback:
    get:
      tags: [GitHub]
      summary: Handle GitHub OAuth callback
      description: >
        On success, creates a server-side session, sets the session cookie and a
        readable CSRF cookie, then redirects to the frontend.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302': { description: Redirect to frontend with an authenticated session. }

  /auth/logout:
    post:
      tags: [GitHub]
      summary: Log out
      description: Deletes the server-side session record and clears cookies.
      security: [{ sessionAuth: [] }]
      responses:
        '204': { description: Logged out. }

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: CODEMASTERS_SESSION
      description: >
        Server-side session cookie set by /auth/github/callback. State-changing
        requests additionally require an X-CSRF-Token header matching the
        session's CSRF token.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IssueId:
      name: issueId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded for this action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status: { type: string, example: UP }
        timestamp: { type: string, format: date-time }

    Difficulty:
      type: string
      enum: [beginner, intermediate, advanced, unknown]

    ProjectConnection:
      type: string
      enum: [south_african, africa_focused, africa_led, community_verified]

    MaintainerRole:
      type: string
      enum: [owner, maintainer]

    Project:
      type: object
      required: [id, name, githubUrl, description, primaryLanguage, connection, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Example SA Project }
        slug: { type: string, example: example-sa-project }
        description: { type: string }
        githubUrl: { type: string, format: uri }
        owner: { type: string, example: example-org, description: GitHub org/user login — not a Code Masters user. }
        primaryLanguage: { type: string, example: Java }
        languages: { type: array, items: { type: string } }
        category: { type: string, example: Developer Tools }
        tags: { type: array, items: { type: string } }
        countryCodes: { type: array, items: { type: string, example: ZA } }
        connection: { $ref: '#/components/schemas/ProjectConnection' }
        license: { type: string, example: MIT }
        stars: { type: integer, minimum: 0 }
        forks: { type: integer, minimum: 0 }
        openIssues: { type: integer, minimum: 0 }
        contributors: { type: integer, minimum: 0 }
        hasBeginnerFriendlyIssues: { type: boolean, description: True if at least one open issue is currently marked beginner-friendly. Denormalized for list-view display; recomputed on issue sync/classification change. }
        lastActivityAt: { type: string, format: date-time }
        verified: { type: boolean }
        verifiedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            maintainers:
              type: array
              items: { $ref: '#/components/schemas/ProjectMaintainer' }
            featuredIssues:
              type: array
              items: { $ref: '#/components/schemas/Issue' }
            recentComments:
              type: array
              items: { $ref: '#/components/schemas/Comment' }

    ProjectMaintainer:
      type: object
      required: [user, role, since]
      properties:
        user: { $ref: '#/components/schemas/PublicUserProfile' }
        role: { $ref: '#/components/schemas/MaintainerRole' }
        since: { type: string, format: date-time }

    AddMaintainerRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }
        role:
          allOf: [{ $ref: '#/components/schemas/MaintainerRole' }]
          default: maintainer

    CreateProjectRequest:
      type: object
      required: [githubUrl, connection, category]
      properties:
        githubUrl: { type: string, format: uri }
        connection: { $ref: '#/components/schemas/ProjectConnection' }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        countryCodes: { type: array, items: { type: string, example: ZA } }

    UpdateProjectRequest:
      type: object
      properties:
        category: { type: string }
        tags: { type: array, items: { type: string } }
        connection: { $ref: '#/components/schemas/ProjectConnection' }
        countryCodes: { type: array, items: { type: string, example: ZA } }

    Issue:
      type: object
      required: [id, projectId, title, githubUrl, status, difficulty, claimCount]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        githubIssueNumber: { type: integer }
        title: { type: string }
        bodyExcerpt: { type: string }
        githubUrl: { type: string, format: uri }
        status: { type: string, enum: [open, closed, claimed] }
        labels: { type: array, items: { type: string } }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        isBeginnerFriendly: { type: boolean }
        difficultyOverridden:
          type: boolean
          description: True if a maintainer manually set difficulty/beginner-friendly; sync will not overwrite it.
        maintainerResponseScore: { type: number, minimum: 0, maximum: 100 }
        projectHealthScore: { type: number, minimum: 0, maximum: 100 }
        freshnessScore: { type: number, minimum: 0, maximum: 100 }
        contributionScore: { type: number, minimum: 0, maximum: 100 }
        claimCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IssueDetail:
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          properties:
            project: { $ref: '#/components/schemas/Project' }
            comments:
              type: array
              items: { $ref: '#/components/schemas/Comment' }
            claims:
              type: array
              items: { $ref: '#/components/schemas/Claim' }

    UpdateIssueRequest:
      type: object
      description: All fields optional; only provided fields are changed.
      properties:
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        isBeginnerFriendly: { type: boolean }

    Comment:
      type: object
      required: [id, author, body, createdAt]
      properties:
        id: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/PublicUserProfile' }
        body: { type: string, maxLength: 5000 }
        edited: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }

    UpdateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }

    Claim:
      type: object
      required: [id, issueId, user, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        issueId: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/PublicUserProfile' }
        status: { type: string, enum: [active, released, completed] }
        note: { type: string, maxLength: 280, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateClaimRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 280
          description: Optional short note on approach/plan, shown to other claimants and the maintainer.

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/PublicUserProfile'
        - type: object
          properties:
            email: { type: string, format: email }
            githubAccess: { type: boolean }

    PublicUserProfile:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri }
        bio: { type: string }
        location: { type: string }
        skills: { type: array, items: { type: string } }
        projectsCount: { type: integer }
        contributionsCount: { type: integer }
        reputation: { type: integer }

    UpdateUserRequest:
      type: object
      properties:
        displayName: { type: string }
        bio: { type: string, maxLength: 1000 }
        location: { type: string }
        skills: { type: array, items: { type: string } }

    SyncJob:
      type: object
      required: [jobId, projectId, status, startedAt]
      properties:
        jobId: { type: string, format: uuid }
        projectId: { type: integer, format: int64 }
        status: { type: string, enum: [accepted, running, completed, failed] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        errorMessage: { type: string, nullable: true }
        retryAfter:
          type: string
          format: date-time
          nullable: true
          description: Set when status is failed due to a GitHub rate limit; earliest time a retry is likely to succeed.
        issuesCreatedCount: { type: integer, nullable: true }
        issuesUpdatedCount: { type: integer, nullable: true }

    ProjectSearchResult:
      allOf:
        - type: object
          required: [resultType]
          properties:
            resultType: { type: string, enum: [project] }
        - $ref: '#/components/schemas/Project'

    IssueSearchResult:
      allOf:
        - type: object
          required: [resultType]
          properties:
            resultType: { type: string, enum: [issue] }
        - $ref: '#/components/schemas/Issue'

    SearchResultItem:
      oneOf:
        - $ref: '#/components/schemas/ProjectSearchResult'
        - $ref: '#/components/schemas/IssueSearchResult'
      discriminator:
        propertyName: resultType
        mapping:
          project: '#/components/schemas/ProjectSearchResult'
          issue: '#/components/schemas/IssueSearchResult'

    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    PagedProjects:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Project' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PagedIssues:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PagedComments:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    PagedSearchResults:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SearchResultItem' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: PROJECT_NOT_FOUND }
        message: { type: string, example: The requested project does not exist. }
        timestamp: { type: string, format: date-time }
        path: { type: string }
        details: { type: object, additionalProperties: true }
